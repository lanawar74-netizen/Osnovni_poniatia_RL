<!doctype html><html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Основни понятия – релационни бази данни</title><style>
:root{--p:#7046a2;--g:#24856b;--bg:#f7f8fc;--ink:#202338}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:16px/1.55 'Segoe UI',Arial,sans-serif;color:var(--ink)}header{background:linear-gradient(115deg,#62429a,#287e74);color:white;padding:28px max(20px,calc((100vw - 1100px)/2))}header h1{margin:0;font-size:clamp(23px,3vw,36px)}main{max-width:1100px;margin:auto;padding:22px}nav{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}button{cursor:pointer;border:0;border-radius:9px;background:var(--p);color:white;padding:10px 16px;font-weight:600;font-size:15px}button.secondary{background:#e8e2f3;color:#3b2c59}button.active{background:var(--g)}button:disabled{opacity:.4;cursor:not-allowed}.panel{background:white;border:1px solid #e3e4ec;border-radius:15px;padding:22px;margin-bottom:16px;box-shadow:0 3px 14px #19213a0b}.task{display:none}.task.active{display:block}h2{color:#56358c;margin:0 0 12px}h3{margin:20px 0 10px;color:#277b65}.q{padding:14px 0;border-bottom:1px solid #eaeaf1}.q:last-child{border:0}.q label{display:block;margin:4px 0}.q strong{display:block;margin-bottom:8px}input[type=text],input[type=date],textarea,select{border:1px solid #c7c8d4;border-radius:7px;padding:9px;font:inherit;max-width:100%;background:white;color:var(--ink)}input[type=text]{width:240px}textarea{width:100%;min-height:80px;resize:vertical}.fields{display:flex;gap:12px;flex-wrap:wrap}.fields label{display:flex;flex-direction:column;gap:4px}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;margin:12px 0}td,th{border:1px solid #d6d9e2;padding:9px;text-align:left;vertical-align:top}th{background:#e8f3ef}td input[type=text]{width:100%;min-width:110px}td select{min-width:100px}.note{border-left:4px solid var(--g);padding:12px;background:#eff8f4;margin:14px 0}.feedback{margin-top:8px;font-size:14px;font-weight:600}.correct{color:#167250}.wrong{color:#a13c49}.toolbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:20px 0}.progress{height:9px;background:#e0e3ed;border-radius:20px;overflow:hidden}.progress>div{height:100%;background:var(--g);width:20%;transition:width .2s}.diagram{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;margin:20px 0}.node{border:2px solid #a5d0c4;border-radius:12px;padding:15px;min-width:190px;background:#f5fbf9;text-align:center}.arrow{font-size:26px;color:var(--p)}.small{font-size:13px;color:#5e6273}.choice{display:flex!important;align-items:center;gap:7px;padding:5px}.choice input{accent-color:var(--g)}.pill{display:inline-block;background:#eee6f7;color:#5d3889;border-radius:20px;padding:3px 10px;margin:3px}.worksheet-image{display:block;max-width:100%;height:auto;max-height:360px;object-fit:contain;margin:16px auto;border:1px solid #e3e4ec;border-radius:10px;background:#fff}.figure-caption{text-align:center;font-size:13px;color:#606477;margin:0 0 16px}.score{font-size:20px;font-weight:700;color:var(--g)}@media print{header,nav,.toolbar,.progress,button,.no-print{display:none!important}main{max-width:none;padding:0}.task{display:block!important;break-before:page}.panel{box-shadow:none;border:0;padding:10px}.q{break-inside:avoid}textarea{min-height:45px}}
</style></head><body><header><h1>Основни понятия в релационните бази от данни</h1><div>Тема 30 · Интерактивно упражнение</div></header><main><section class="panel"><div class="fields"><label>Име и фамилия<input id="student" type="text" placeholder="Въведете име"></label><label>Клас<input id="klass" type="text" placeholder="Напр. 9А"></label><label>Дата<input id="date" type="date"></label></div><p class="small">Попълнете задачите последователно. Проверяването не изтрива написаното. Отговорите не се изпращат на сървър.</p><div class="progress"><div id="bar"></div></div></section><nav id="tabs"></nav><div id="tasks"></div><div class="toolbar"><button class="secondary" id="prev">← Предишна</button><div><button id="check">Провери раздела</button> <button class="secondary" id="print">Разпечатай</button> <button class="secondary" id="saveTxt">Запази в текст (.txt)</button></div><button id="next">Следваща →</button></div><div id="result" class="panel" aria-live="polite">Изберете раздел и попълнете отговорите.</div></main><script>
const tasks=document.getElementById('tasks');let page=0;const answers=[];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function q(id,label,kind='text',opts=[],answer=null){if(answer!==null)answers.push({id,answer});let control=kind==='select'?`<select id="${id}"><option value="">— Изберете —</option>${opts.map(x=>`<option>${esc(x)}</option>`).join('')}</select>`:kind==='area'?`<textarea id="${id}" placeholder="Напишете отговора си..."></textarea>`:`<input type="text" id="${id}" placeholder="Вашият отговор">`;return `<div class="q"><strong>${label}</strong>${control}<div class="feedback" id="f_${id}"></div></div>`}
function table(headers,rows){return `<div class="scroll"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function s(id,opts,answer){answers.push({id,answer});return `<select id="${id}"><option value="">— Изберете —</option>${opts.map(o=>`<option>${esc(o)}</option>`).join('')}</select>`}
function input(id,answer=null){if(answer!==null)answers.push({id,answer});return `<input type="text" id="${id}" placeholder="Отговор">`}
function area(id){return `<textarea id="${id}" placeholder="Напишете обосновка..."></textarea>`}
const concepts=['релация','запис','атрибут'];const types=['1:1','1:N','N:M'];let html=[];
let a=`<h2>Задача 1. Релация, запис, атрибут</h2><img class="worksheet-image" src="illustration_1.png" alt="Схема за релация, запис и атрибут"><p class="figure-caption">Илюстрация от работния лист: релация, запис и атрибут</p><div class="note">Релацията е таблица. Редът е запис, колоната е атрибут, а съдържанието на клетката е стойност на атрибут.</div><h3>Таблица „Ученици“</h3>`;
a+=table(['№','Име','Клас','Град','Телефон'],[['1','Иван Петров','9А','Велико Търново','0888 111 222'],['2','Мария Георгиева','9Б','Горна Оряховица','0877 333 444'],['3','Георги Димитров','9А','Велико Търново','0899 555 666'],['4','Елена Николова','9В','Лясковец','0888 777 888']]);a+='<h3>1.1. Допълнете празните места</h3>';[['Цялата таблица се нарича','релация'],['Всеки ред се нарича','запис'],['Всяка колона се нарича','атрибут'],['Брой записи','4'],['Брой атрибути','5']].forEach((x,i)=>a+=q('a'+i,x[0],'select',i<3?concepts:['3','4','5','6'],x[1]));a+='<h3>1.2. Оградете верния отговор</h3>';[['„Мария Георгиева“ е','стойност на атрибут',['запис','атрибут','стойност на атрибут']],['„Град“ е','атрибут',['запис','атрибут','релация']],['Редът с Георги Димитров е','запис',['запис','атрибут','релация']]].forEach((x,i)=>a+=q('a'+(i+5),x[0],'select',x[2],x[1]));a+='<h3>1.3. Таблица „Предмети“</h3>'+table(['Предмет','Часове','Часове'],[['Информатика','2','2'],['Математика','4','4'],['Информатика','2','2']])+q('a8','Посочете поне две нарушени характеристики на релацията.','area');html.push(a);
let b='<h2>Задача 2. Първичен ключ в реални ситуации</h2><img class="worksheet-image" src="illustration_2.png" alt="Характеристики на първичния ключ"><p class="figure-caption">Илюстрация от работния лист: първичен ключ</p><div class="note">Първичният ключ еднозначно определя всеки запис. Той трябва да е уникален и да не е празен. Ако липсва подходящ атрибут, може да се добави ID.</div><h3>2.1. Изберете първичен ключ и обяснете защо</h3>';let rows=[['Граждани','ЕГН, Име, Адрес','ЕГН'],['Автомобили','Рег. номер, Марка, Цвят, Собственик','Рег. номер'],['Книги','Заглавие, Автор, Година','Нов ID'],['Стоки','Име, Цена, Количество','Нов ID'],['Ученици','Име, Клас, Град','Нов ID'],['Телефонен указател','Име, Телефон','Нов ID']];b+=table(['Таблица','Атрибути','Първичен ключ','Защо?'],rows.map((r,i)=>[r[0],r[1],s('b'+i,[...new Set([...r[1].split(', '),'Нов ID'])],r[2]),area('br'+i)]));b+=q('b6','2.2. Защо „Име“ не е добър първичен ключ за учениците?','area')+q('b7','2.3. Две стоки се казват „Вафла“, но са от различни производители. Как ще ги различава системата?','area')+q('b8','2.4. Защо често се използва автоматично увеличаващ се ID?','area');html.push(b);
let c='<h2>Задача 3. Външен ключ</h2><img class="worksheet-image" src="illustration_3.png" alt="Външен ключ и свързване на таблици"><p class="figure-caption">Илюстрация от работния лист: външен ключ</p><div class="note">Външният ключ в дъщерната таблица сочи към ключ в родителската. Така таблиците могат да се свързват.</div><div class="diagram"><div class="node"><b>Клиенти</b><br>КлиентID <span class="pill">PK</span><br>Име · Град</div><div class="arrow">1 → N</div><div class="node"><b>Поръчки</b><br>ПоръчкаID <span class="pill">PK</span><br>КлиентID <span class="pill">FK</span></div></div><h3>Дадени са две таблици на фирма</h3>';c+=table(['КлиентID','Име','Град'],[['1','Петър Иванов','Велико Търново'],['2','Мила Стоянова','Габрово'],['3','Николай Йорданов','Русе']]);c+=table(['ПоръчкаID','Дата','Сума','КлиентID'],[['101','05.11.2026','120 лв.','2'],['102','07.11.2026','45 лв.','1'],['103','09.11.2026','300 лв.','2'],['104','12.11.2026','80 лв.','3']]);c+='<h3>3.1. Посочете ключовете и таблиците</h3>';[['Първичен ключ на „Клиенти“','КлиентID',['КлиентID','ПоръчкаID','Име']],['Първичен ключ на „Поръчки“','ПоръчкаID',['КлиентID','ПоръчкаID','Дата']],['Външен ключ в „Поръчки“','КлиентID',['КлиентID','ПоръчкаID','Сума']],['Таблица родител','Клиенти',['Клиенти','Поръчки']],['Таблица дъщеря','Поръчки',['Клиенти','Поръчки']]].forEach((x,i)=>c+=q('c'+i,x[0],'select',x[2],x[1]));c+='<h3>3.2. Отговорете с помощта на таблиците</h3>';[['Кой клиент е направил поръчка 103?','Мила Стоянова',['Мила Стоянова','Петър Иванов','Николай Йорданов']],['Колко поръчки е направила Мила Стоянова?','2',['1','2','3']],['Коя поръчка е на клиент от Велико Търново?','102',['101','102','103','104']]].forEach((x,i)=>c+=q('c'+(i+5),x[0],'select',x[2],x[1]));c+=q('c8','3.3. Какъв проблем възниква при поръчка 105 с КлиентID = 9?','area')+q('c9','3.4. Жанрове (ЖанрID, Име на жанр) и Песни (ПесенID, Заглавие, Продължителност, ...). Кой атрибут добавяме в „Песни“?','select',['ЖанрID','Име на жанр','ПесенID'],'ЖанрID')+q('c10','Кой е първичният и кой външният ключ при свързването на жанровете и песните?','area');html.push(c);
let d='<h2>Задача 4. Видове връзки между таблиците</h2><img class="worksheet-image" src="illustration_4.png" alt="Видове връзки между таблиците"><p class="figure-caption">Илюстрация от работния лист: видове връзки</p><div class="diagram"><div class="node">1:1<br><b>Един към един</b></div><div class="node">1:N<br><b>Един към много</b></div><div class="node">N:M<br><b>Много към много</b></div></div><h3>4.1. Определете вида и обосновете</h3>';let rel=[['Държава – Столица','1:1'],['Клас – Ученици (всеки ученик е в един клас)','1:N'],['Автор – Книги (всяка книга има един автор)','1:N'],['Читател – Книги (чрез заемане)','N:M'],['Ученик – Клубове по интереси','N:M'],['Стока – Баркод (всяка стока има точно един код)','1:1'],['Учител – Предмети (един учител преподава няколко предмета, всеки предмет – само един учител)','1:N'],['Лекар – Пациенти','N:M']];d+=table(['Ситуация','Вид връзка','Обосновка'],rel.map((r,i)=>[r[0],s('d'+i,types,r[1]),area('dr'+i)]));d+=q('d8','4.2. Как се реализира връзка много към много?','area')+'<h3>4.3. Библиотека</h3><p>Читатели (ЧитателID, Име) и Книги (КнигаID, Заглавие).</p>';d+=q('d9','а) Какъв е видът на връзката между читатели и книги?','select',types,'N:M')+q('d10','б) Кой първи липсващ атрибут добавяме във „Вземане“?','select',['ЧитателID','Заглавие','Име'],'ЧитателID')+q('d11','Кой е вторият липсващ атрибут?','select',['КнигаID','Име','Заглавие'],'КнигаID')+q('d12','в) Кои са външните ключове и към кои таблици сочат?','area')+q('d13','г) Какъв е видът на връзките Читатели – Вземане и Книги – Вземане?','select',types,'1:N');html.push(d);
let e='<h2>Задача 5. Система за управление на база данни (СУБД)</h2><img class="worksheet-image" src="illustration_5.png" alt="СУБД и основни функции"><p class="figure-caption">Илюстрация от работния лист: функции на СУБД</p><div class="diagram"><div class="node">Потребител / приложение</div><div class="arrow">⇄</div><div class="node">СУБД<br><small>SQL заявки</small></div><div class="arrow">⇄</div><div class="node">База данни</div></div><h3>5.1. Свържете функциите с описанията</h3>';let opts=['А) Достъп на различни потребители и приложения','Б) Добавяне, изтриване и промяна','В) Съхраняване във файловата система и паметта','Г) Заявки по зададени условия','Д) Стандартен език SQL за комуникация'];[['Управление на данните',opts[2]],['Осигуряване на достъп',opts[0]],['Обновяване',opts[1]],['Търсене и извличане',opts[3]],['Комуникация с БД',opts[4]]].forEach((x,i)=>e+=q('e'+i,x[0],'select',opts,x[1]));e+='<h3>5.2. Кои софтуери са СУБД?</h3>';let softwares=['MySQL','Microsoft Word','MS Access','Oracle','Excel','MS SQL Server','Photoshop','SQLite'];e+='<div class="q">'+softwares.map((x,i)=>`<label class="choice"><input type="checkbox" id="soft${i}"> ${x}</label>`).join('')+'<div class="feedback" id="f_soft"></div></div><h3>5.3. Подредете стъпките (1–3)</h3>';[['СУБД обработва резултата и го изпраща обратно','3'],['Потребителят изпраща SQL заявка към СУБД','1'],['Системата разчита заявката и търси данните','2']].forEach((x,i)=>e+=q('e'+(i+5),x[0],'select',['1','2','3'],x[1]));e+='<h3>5.4. Верни или неверни?</h3>';[['Базата данни и СУБД са едно и също.','Н'],['Една БД може да съдържа много таблици.','В'],['Първичният ключ може да има повтарящи се стойности.','Н'],['Външният ключ в дъщерната таблица е копие на първичния ключ от родителската.','В'],['SQL е език за структурирани заявки към база данни.','В'],['Редът на записите в релацията е определящ за нейния смисъл.','Н']].forEach((x,i)=>e+=q('e'+(i+8),x[0],'select',['В','Н'],x[1]));e+='<img class="worksheet-image" src="illustration_6.png" alt="Свързани таблици и избягване на дублиране на данни"><p class="figure-caption">Илюстрация от работния лист: свързани таблици и повторение на данни</p>';html.push(e);
tasks.innerHTML=html.map((x,i)=>`<section class="panel task" data-page="${i}">${x}</section>`).join('');document.getElementById('tabs').innerHTML=html.map((_,i)=>`<button class="secondary" data-tab="${i}">Задача ${i+1}</button>`).join('');function show(i){page=Math.max(0,Math.min(4,i));document.querySelectorAll('.task').forEach((x,j)=>x.classList.toggle('active',j===page));document.querySelectorAll('[data-tab]').forEach((x,j)=>{x.className=j===page?'active':'secondary'});document.getElementById('bar').style.width=((page+1)*20)+'%';document.getElementById('prev').disabled=page===0;document.getElementById('next').disabled=page===4;document.getElementById('result').textContent=`Задача ${page+1} от 5. Свободните отговори се преглеждат от учителя.`;window.scrollTo({top:0,behavior:'smooth'})}document.querySelectorAll('[data-tab]').forEach(x=>x.onclick=()=>show(+x.dataset.tab));document.getElementById('prev').onclick=()=>show(page-1);document.getElementById('next').onclick=()=>show(page+1);document.getElementById('print').onclick=()=>window.print();document.getElementById('check').onclick=()=>{let root=document.querySelector('.task.active'),items=answers.filter(x=>root.contains(document.getElementById(x.id))),right=0,done=0;items.forEach(x=>{let el=document.getElementById(x.id),v=el.value.trim(),ok=v===x.answer,f=document.getElementById('f_'+x.id);if(v)done++;if(ok)right++;f.className='feedback '+(ok?'correct':'wrong');f.textContent=!v?'Няма избран отговор.':ok?'✓ Вярно':'✗ Проверете отговора си.'});if(page===4){let chosen=softwares.filter((_,i)=>document.getElementById('soft'+i).checked),expected=['MySQL','MS Access','Oracle','MS SQL Server','SQLite'],ok=chosen.length===expected.length&&chosen.every(x=>expected.includes(x));let f=document.getElementById('f_soft');f.textContent=ok?'✓ Правилно избрани СУБД.':'Проверете избраните програми.';f.className='feedback '+(ok?'correct':'wrong');right+=+ok;done+=+(chosen.length>0);items.push({})}let free=[...root.querySelectorAll('textarea')].filter(x=>x.value.trim()).length;document.getElementById('result').innerHTML=`<div class="score">${right} верни от ${items.length} автоматично проверявани отговора</div><p>Попълнени свободни текстови полета: ${free}. Те изискват преглед от учителя. Не се поставя автоматична оценка.</p>`};document.getElementById('saveTxt').onclick=()=>{
 const lines=['ОСНОВНИ ПОНЯТИЯ В РЕЛАЦИОННИТЕ БАЗИ ОТ ДАННИ','Интерактивен работен лист','',`Име: ${document.getElementById('student').value||'—'}`,`Клас: ${document.getElementById('klass').value||'—'}`,`Дата: ${document.getElementById('date').value||'—'}`,''];
 document.querySelectorAll('.task').forEach((section,index)=>{
  lines.push('='.repeat(55),`ЗАДАЧА ${index+1}`,'');
  let number=0;
  section.querySelectorAll('.q, table tbody tr').forEach(node=>{
   const controls=[...node.querySelectorAll('input,select,textarea')];
   if(!controls.length)return;
   if(node.classList.contains('q')){
    const question=node.querySelector('strong');
    const label=question?question.innerText.trim():`Въпрос ${++number}`;
    const values=controls.map(el=>el.type==='checkbox'?(el.checked?'Да':'Не'):(el.value||'Не е попълнено'));
    lines.push(label,`Отговор: ${values.join('; ')}`,'');
   }else{
    const cells=[...node.querySelectorAll('td')];
    const context=cells.filter(td=>!td.querySelector('input,select,textarea')).map(td=>td.innerText.trim()).filter(Boolean).join(' | ');
    lines.push(context||`Ред ${++number}`);
    controls.forEach((el,i)=>lines.push(`Отговор ${i+1}: ${el.type==='checkbox'?(el.checked?'Да':'Не'):(el.value||'Не е попълнено')}`));lines.push('');
   }
  });
  // Include any inputs outside question cards and table rows.
  section.querySelectorAll('input,select,textarea').forEach(el=>{
   if(el.closest('.q, tbody tr'))return;
   const label=el.closest('label')?.innerText.trim()||el.previousElementSibling?.innerText?.trim()||el.id;
   lines.push(`${label}: ${el.type==='checkbox'?(el.checked?'Избрано':'Не е избрано'):(el.value||'Не е попълнено')}`);
  });
  lines.push('');
 });
